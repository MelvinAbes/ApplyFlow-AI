[project]
name = "job-application-assistant"
version = "0.1.0"
description = "Local-first, human-approved job application assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "openai-codex>=0.147,<1",
  "playwright>=1.54,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<7",
  "python-multipart>=0.0.20,<1",
  "sqlmodel>=0.0.24,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008", # FastAPI intentionally uses Depends/File/Form/Query in defaults.
  "E501", # Ruff formatter owns line wrapping; long prompts/selectors are readable as-is.
  "UP017", # timezone.utc remains compatible with all supported Python versions.
  "UP046", # Generic base syntax is clearer for this small repository helper.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
