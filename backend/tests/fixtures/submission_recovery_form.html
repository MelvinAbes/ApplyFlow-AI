<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Submission recovery fixture</title></head>
<body>
  <form id="application-form" onsubmit="window.submits=(window.submits||0)+1; event.preventDefault()">
    <label for="first-name">First name</label>
    <input id="first-name" name="first_name" value="Ada" required>
    <div style="height: 1200px"></div>
    <button id="submit" type="submit">Submit application</button>
  </form>
</body>
</html>
